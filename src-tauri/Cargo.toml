[package]
name = "npcc"
version = "0.1.1"
description = "Npcc - a lightweight Notepad++-like text editor"
authors = ["npcc"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "npcc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "0.1"
ignore = "0.4"
globset = "0.4"
regex = "1"
thiserror = "2"
dunce = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
